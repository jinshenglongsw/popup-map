<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>快闪地图</title>
<style>
:root{--brand:#ff5a1f;--brand2:#fff1eb;--green:#03c75a;--ink:#191f28;--sub:#6b7684;--mute:#8b95a1;--line:#e5e8eb;--bg:#f2f4f6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Apple SD Gothic Neo",sans-serif;background:#fff;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#map{width:100%;height:100%}  /* Naver 会把容器改成 position:relative, 只靠 inset 高度会变 0 (10/30 踩过) */

/* 顶部: 街区·日期 + 类别标签(两行全摆出来, 可多选) */
#top{position:absolute;top:0;left:0;right:0;z-index:20;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:10px 12px 8px}
#where{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
#where b{font-size:18px}
#where span{font-size:13px;color:var(--sub)}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:16px;background:var(--bg);font-size:14px;font-weight:600;color:#333d4b;white-space:nowrap}
.chip i{font-style:normal;color:var(--mute);font-weight:500;margin-left:3px}
.chip.on{background:var(--ink);color:#fff}.chip.on i{color:#c9cdd2}

/* 图钉: 拉近 = 店铺照片 + 类别角标; 缩远 = 小圆点 */
.mk{position:relative;width:42px;height:50px}
.mk .ph{width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:#ddd center/cover no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk .tail{position:absolute;left:15px;top:38px;border:6px solid transparent;border-top:8px solid #fff}
.mk .tg{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mk .no{position:absolute;left:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--brand);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.mk.on .ph{border-color:var(--brand);transform:scale(1.25);transform-origin:50% 100%}
.mk.on .tail{border-top-color:var(--brand)}
.dot{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--brand);font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.dot.pk{border-color:var(--ink);border-width:3px}
.st{background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:14px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap}

/* 底部可上拉清单 */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.12);display:flex;flex-direction:column;transition:height .22s ease;height:38%}
#sheet.full{height:calc(100% - var(--toph) - 8px)}
#sheet.min{height:150px}
#grip{padding:8px 16px 6px;flex:none}
#grip .bar{width:40px;height:5px;border-radius:3px;background:#d1d6db;margin:0 auto 8px}
#grip .cnt{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#grip .cnt small{font-weight:500;color:var(--sub);font-size:12px}
#list{flex:1;overflow-y:auto;padding:0 16px 80px;-webkit-overflow-scrolling:touch}
.it{padding:12px 0;border-bottom:1px solid var(--line)}
.it .row{display:flex;gap:12px;align-items:flex-start}
.strip{display:none;gap:4px;margin-bottom:10px}.strip i{flex:1;height:150px;border-radius:10px;background:#eee center/cover no-repeat}.strip i:first-child{flex:2}
#sheet.full .strip{display:flex}#sheet.full .it .im{display:none}
.it .th{font-size:12px;color:var(--sub);margin-top:1px}
.it .of{font-size:13px;color:var(--brand);font-weight:600;margin:0 0 5px;line-height:1.4}
.it.on{background:linear-gradient(90deg,var(--brand2),#fff)}
.it .im{flex:0 0 88px;height:88px;border-radius:10px;background:#eee center/cover no-repeat;position:relative}
.it .im b{position:absolute;left:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.it .tx{flex:1;min-width:0}
.it .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .l1{font-size:14px;color:#333d4b;margin:3px 0 5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:4px;font-size:11px}
.tags span{padding:2px 6px;border-radius:5px;background:var(--bg);color:var(--sub);font-weight:600}
.tags .c{background:var(--brand2);color:var(--brand)}
.tags .w{background:#fff8e1;color:#b26a00}
.add{flex:0 0 36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-size:22px;color:var(--sub);display:flex;align-items:center;justify-content:center;margin-top:16px}
.add.on{background:var(--brand);border-color:var(--brand);color:#fff;font-size:15px;font-weight:800}
.note{font-size:12px;color:var(--sub);padding:8px 0}

/* 底栏: 我的路线 */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:16;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#bar button{width:100%;padding:14px 0;border-radius:12px;background:var(--ink);color:#fff;font-size:16px;font-weight:700}
#bar button:disabled{background:var(--bg);color:var(--mute)}
#rhead{display:none;align-items:center;gap:8px;margin-bottom:2px}
body.route #rhead{display:flex}
body.route #chips{display:none}
#rhead button{padding:6px 10px;border-radius:14px;background:var(--bg);font-size:13px;font-weight:600}
#rnote{font-size:12px;color:#b26a00;flex:1}
.mv{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.mv button{width:32px;height:28px;border-radius:8px;background:var(--bg);font-size:14px}

/* 详情 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
#det{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease}
#det.open{transform:none}
#dbody{overflow-y:auto;padding:6px 20px 16px}
#det .x{position:absolute;right:14px;top:10px;width:32px;height:32px;border-radius:50%;background:var(--bg);font-size:18px;color:var(--sub)}
#det h2{margin:6px 40px 4px 0;font-size:19px;line-height:1.35}
#det .what{color:var(--sub);font-size:14px;margin-bottom:10px}
.act{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0}
.act .g{font-size:15px;font-weight:700;line-height:1.45}
.act .d{font-size:13px;color:#4e5968;margin-top:3px;line-height:1.45}
.act .k{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;margin-right:6px;background:#fff;color:var(--brand)}
.act.paid .k{color:var(--sub)}
.hl{background:var(--brand2);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;margin:8px 0}
.kv{border-top:1px solid var(--line);margin-top:12px;padding-top:6px}
.kv>div{display:flex;gap:10px;padding:6px 0;font-size:14px;line-height:1.45}
.kv span{flex:0 0 52px;color:var(--sub)}
.kv u{color:var(--brand);text-decoration:none;font-size:13px;margin-left:6px;white-space:nowrap}
.gal{display:flex;gap:6px;overflow-x:auto;margin:12px 0 4px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 46%;height:150px;object-fit:cover;border-radius:10px;background:#eee}
details{margin-top:8px;font-size:13px;color:var(--sub)}
details p{margin:6px 0;line-height:1.5}
#dbtn{display:flex;gap:8px;padding:10px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#dbtn a,#dbtn button{flex:1;text-align:center;padding:14px 0;border-radius:12px;text-decoration:none;font-weight:700;font-size:15px}
.b1{background:var(--bg);color:var(--ink)}.b1.on{background:var(--brand2);color:var(--brand)}
.b2{background:var(--green);color:#fff}
.cap{font-size:11px;color:var(--mute);margin-bottom:6px}
.sum{font-size:15px;line-height:1.6;margin:10px 0}
#det h4{margin:16px 0 6px;font-size:15px}
.ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6;color:#333d4b}
.act .k2{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;margin-right:6px;background:#e8f3ff;color:#1b64da}
.act .k.paid{color:var(--sub)}
.vis{background:#f9fafb;border-left:3px solid #d1d6db;padding:8px 10px;margin:6px 0;font-size:14px;line-height:1.55}
.vis b{display:block;font-size:12px;color:var(--sub);font-weight:600}.vis a{color:var(--brand);font-size:12px;white-space:nowrap}
.unk{font-size:12px;color:#b26a00;background:#fff8e1;border-radius:8px;padding:8px 10px;margin-top:10px}
.more summary{font-size:14px;color:var(--sub);padding:6px 0;cursor:pointer}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:rgba(25,31,40,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;display:none}
#err{position:absolute;top:120px;left:16px;right:16px;z-index:5;font-size:14px;color:var(--sub);display:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="err"></div>
<div id="top">
  <div id="where"><b id="area">加载中…</b><span id="day"></span></div>
  <div id="rhead"><button id="rback">← 回到全部</button><span id="rnote">虚线 = 建议顺序，不是步行路线</span></div>
  <div id="chips"></div>
</div>
<div id="sheet">
  <div id="grip"><div class="bar"></div><div class="cnt"><span id="cnt"></span><small id="hint"></small></div></div>
  <div id="list"></div>
</div>
<div id="bar"><button id="rbtn" disabled>点 ＋ 挑想去的店</button></div>
<div id="mask"></div>
<div id="det"><button class="x" id="dx">✕</button><div id="dbody"></div><div id="dbtn"></div></div>
<div id="toast"></div>
<script>
// 数据: ?d=<名> → d/<名>.json (popup-monitor research_1101/build_map2.py 生成)
var KEY = "kf4vf7nyey";
var Q = new URLSearchParams(location.search), DN = Q.get("d") || "sample";
var D = null, map = null, MK = {}, sel = [], picked = [], cur = null, mode = "all", line = null, near = false;
var EMO = {gift: "🎁", fun: "🎮", paid: "🎟", food: "🍰", brand: "👟"};
function $(id){ return document.getElementById(id) }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c] }) }
function bg(u){ return u ? ' style="background-image:url(&quot;' + esc(u) + '&quot;)"' : "" }
function toast(t){ var e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function(){ e.style.display = "none" }, 1600) }
function byId(id){ for (var i = 0; i < D.stores.length; i++) if (D.stores[i].id === id) return D.stores[i] }
function short(w){ return String(w || "").replace(/\d{4}-0?(\d+)-0?(\d+)/g, "$1/$2") }

// 已挑的店存本机, 从导航回来不丢 (隐私窗口等存不了就算了)
var SK = "pick:" + DN;
try { picked = JSON.parse(localStorage.getItem(SK) || "[]") } catch (e) {}
function save(){ try { localStorage.setItem(SK, JSON.stringify(picked)) } catch (e) {} }

function visible(){
  if (mode === "route") return picked.map(byId).filter(Boolean);
  return D.stores.filter(function(s){ return !sel.length || s.tags.some(function(t){ return sel.indexOf(t) >= 0 }) });
}
function warn(s){ // 具体的不确定性, 不用笼统的「不一定有」
  var w = [];
  if (!s.hours) w.push("营业时间待确认");
  if (s.acts.some(function(a){ return a.limit })) w.push("限量·余量未知");
  if (s.reserve === "必须预约") w.push("要预约");
  return w;
}

function chips(){
  var h = '<button class="chip' + (sel.length ? "" : " on") + '" data-t="">全部<i>' + D.stores.length + "</i></button>";
  D.tags.forEach(function(t){ if (t[2]) h += '<button class="chip' + (sel.indexOf(t[0]) >= 0 ? " on" : "") + '" data-t="' + t[0] + '">' + t[1] + "<i>" + t[2] + "</i></button>" });
  $("chips").innerHTML = h;
  [].forEach.call($("chips").children, function(b){ b.onclick = function(){
    var t = b.dataset.t;
    if (!t) sel = []; else { var k = sel.indexOf(t); if (k >= 0) sel.splice(k, 1); else sel.push(t) }
    chips(); render(); if (map) fit(visible());
  } });
}

function item(s, n){
  var k = picked.indexOf(s.id), tg = s.tags.map(function(t){ return EMO[t] }).join(""), x = s.x || {};
  var c = s.conds.slice(0, 3).map(function(x){ return '<span class="c">' + esc(x) + "</span>" }).join("");
  var w = warn(s).map(function(x){ return '<span class="w">' + esc(x) + "</span>" }).join("");
  // 清单拉满时每家多一条照片带 (小红书式); 半展开只有缩略图, 方便快速比较 (GPT 第三轮)
  var strip = '<div class="strip">' + s.imgs.slice(0, 3).map(function(u){ return "<i" + bg(u) + "></i>" }).join("") + "</div>";
  return '<div class="it' + (cur === s.id ? " on" : "") + '" data-id="' + s.id + '">' + strip + '<div class="row"><div class="im"' + bg(s.imgs[0]) + ">" + (n ? "<b>" + n + "</b>" : "") + "</div>" +
    '<div class="tx"><div class="nm">' + tg + " " + esc(s.name) + "</div>" + (x.theme ? '<div class="th">' + esc(x.theme) + "</div>" : "") +
    '<div class="l1">' + esc(s.line1) + "</div>" + (x.card_offer ? '<div class="of">🎁 ' + esc(x.card_offer) + "</div>" : "") +
    '<div class="tags"><span>' + (s.hours ? "今天 " + esc(s.hours) : "时间未写") + "</span>" + c + w + "</div></div>" +
    (mode === "route" ? '<div class="mv"><button data-mv="-1">↑</button><button data-mv="1">↓</button></div>' : "") +
    '<button class="add' + (k >= 0 ? " on" : "") + '" data-add="1">' + (k < 0 ? "＋" : mode === "route" ? "✕" : (k + 1)) + "</button></div></div>";
}

function render(){
  var V = visible(), h = "";
  if (mode === "route") {
    $("cnt").textContent = "我的路线 · " + V.length + " 家";
    $("hint").textContent = "↑↓ 调顺序";
  } else {
    $("cnt").textContent = (sel.length ? "筛出 " : "今天可逛 ") + V.length + " 家";
    var hid = picked.filter(function(id){ return V.indexOf(byId(id)) < 0 }).length;
    $("hint").textContent = hid ? "已挑的 " + hid + " 家被筛掉了" : "点 ＋ 挑想去的";
  }
  V.forEach(function(s, i){ h += item(s, mode === "route" ? i + 1 : 0) });
  if (mode === "all") h += '<div class="note">来源 ' + esc(D.src) + "。只收 popply 上登记的快闪。</div>";
  $("list").innerHTML = h;
  [].forEach.call($("list").querySelectorAll(".it"), function(el){
    var id = +el.dataset.id;
    el.onclick = function(e){
      var b = e.target.closest("button");
      if (b && b.dataset.add) return toggle(id);
      if (b && b.dataset.mv) return move(id, +b.dataset.mv);
      focus(id, true); openDet(id);
    };
  });
  $("rbtn").disabled = !picked.length;
  $("rbtn").textContent = mode === "route" ? "全程在 Naver 地图看步行路线" : picked.length ? "我的路线 · " + picked.length + " 家 →" : "点 ＋ 挑想去的店";
  if (map) pins();
}

function toggle(id){
  var k = picked.indexOf(id);
  if (k >= 0) picked.splice(k, 1); else picked.push(id);
  save();
  if (mode === "route" && !picked.length) { mode = "all"; document.body.classList.remove("route") }
  render(); if (mode === "route") drawRoute();
  if ($("det").classList.contains("open")) openDet(id);
  toast(k >= 0 ? "已从路线移除" : "已加入路线（第 " + picked.length + " 家）");
}
function move(id, d){
  var k = picked.indexOf(id), j = k + d;
  if (j < 0 || j >= picked.length) return;
  picked[k] = picked[j]; picked[j] = id; save(); render(); drawRoute();
}

// ---------- 地图 ----------
function mkHtml(s){
  var k = picked.indexOf(s.id), on = cur === s.id;
  if (!near && !on && !(mode === "route")) return '<div class="dot' + (k >= 0 ? " pk" : "") + '">' + EMO[s.tags[0]] + "</div>";
  return '<div class="mk' + (on ? " on" : "") + '"><div class="ph"' + bg(s.imgs[0]) + '></div><div class="tail"></div>' +
    (mode === "route" && k >= 0 ? '<div class="no">' + (k + 1) + "</div>" : '<div class="tg">' + EMO[s.tags[0]] + "</div>") + "</div>";
}
function icon(s){ var big = near || cur === s.id || mode === "route"; return {content: mkHtml(s), anchor: big ? new naver.maps.Point(21, 50) : new naver.maps.Point(13, 13)} }
function pins(){
  var V = visible();
  D.stores.forEach(function(s){
    var m = MK[s.id], show = V.indexOf(s) >= 0;
    m.setMap(show ? map : null);
    if (show) { m.setIcon(icon(s)); m.setZIndex(cur === s.id ? 1000 : picked.indexOf(s.id) >= 0 ? 500 : 100) }
  });
  if (line && mode !== "route") { line.setMap(null); line = null }
}
// 选中的店移到地图可见区中间 (顶栏和底部清单遮住的部分不算)
function focus(id, pan){
  cur = id; pins();
  [].forEach.call($("list").querySelectorAll(".it"), function(el){ el.classList.toggle("on", +el.dataset.id === id) });
  if (!pan || !map) return;
  var s = byId(id);
  if (map.getZoom() < 16) map.setZoom(16, false);
  map.setCenter(new naver.maps.LatLng(s.lat, s.lng));
  map.panBy(new naver.maps.Point(0, ($("sheet").offsetHeight - $("top").offsetHeight) / 2));
}
function fit(list){
  if (!list.length) return;
  var b = new naver.maps.LatLngBounds();
  if (D.start) b.extend(new naver.maps.LatLng(D.start.lat, D.start.lng));
  list.forEach(function(s){ b.extend(new naver.maps.LatLng(s.lat, s.lng)) });
  map.fitBounds(b, {top: $("top").offsetHeight + 30, bottom: $("sheet").offsetHeight + 20, left: 30, right: 30});
}
function drawRoute(){
  if (line) line.setMap(null);
  var path = D.start ? [new naver.maps.LatLng(D.start.lat, D.start.lng)] : [];
  picked.map(byId).forEach(function(s){ path.push(new naver.maps.LatLng(s.lat, s.lng)) });
  line = new naver.maps.Polyline({map: map, path: path, strokeColor: "#ff5a1f", strokeOpacity: .8, strokeWeight: 3, strokeStyle: "shortdash"});
}
// 进路线时从车站出发按就近排一次; 之后尊重手动调的顺序 (再次进入会重排)
function nearest(){
  if (!D.start) return;
  var left = picked.map(byId), cx = D.start, out = [];
  function d2(a, b){ var x = (a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180), y = a.lat - b.lat; return x * x + y * y }
  while (left.length) { left.sort(function(a, b){ return d2(cx, a) - d2(cx, b) }); cx = left.shift(); out.push(cx.id) }
  picked = out; save();
}
function enterRoute(){
  mode = "route"; document.body.classList.add("route"); cur = null;
  document.documentElement.style.setProperty("--toph", $("top").offsetHeight + "px");
  nearest(); render(); $("sheet").className = "";
  if (map) { drawRoute(); setTimeout(function(){ fit(picked.map(byId)) }, 260) }  // 等清单高度动画结束再算视野
}
function leaveRoute(){ mode = "all"; document.body.classList.remove("route"); render(); if (map) fit(visible()) }
// Naver 网页版步行路线: 坐标用 EPSG:3857, 起点+终点+途经最多 5 个 (10/30 用户手机实测 7 站可用、11 站报错)
function m3857(s){ var x = s.lng * 20037508.34 / 180, y = Math.log(Math.tan((90 + s.lat) * Math.PI / 360)) / (Math.PI / 180) * 20037508.34 / 180; return x + "," + y }
function seg(s){ return m3857(s) + "," + encodeURIComponent(s.name) + ",,ADDRESS_POI" }
function naverRoute(){
  var L = picked.map(byId);
  if (!D.start || !L.length) return;
  if (L.length > 6) { toast("Naver 一次最多 6 家，先打开前 6 家"); L = L.slice(0, 6) }
  var goal = L[L.length - 1], mid = L.slice(0, -1);
  location.href = "https://map.naver.com/p/directions/" + seg(D.start) + "/" + seg(goal) + "/" + (mid.length ? mid.map(seg).join(":") : "-") + "/walk";
}

// ---------- 详情 ----------
function openDet(id){
  var s = byId(id), k = picked.indexOf(id), x = s.x, h = "";
  h += "<h2>" + esc(s.name) + '</h2><div class="what">' + s.tags.map(function(t){ return EMO[t] }).join(" ") + " " + esc(x && x.theme || s.what) + "</div>";
  if (s.imgs.length) h += '<div class="gal">' + s.imgs.map(function(u){ return '<img loading="lazy" src="' + esc(u) + '">' }).join("") + '</div><div class="cap">📷 popply 上的官方图（不一定是现场实拍）</div>';
  if (x) {
    if (x.summary) h += '<p class="sum">' + esc(x.summary) + "</p>";
    if (x.scene && x.scene.length) h += '<h4>👀 现场有什么</h4><ul class="ul">' + x.scene.map(function(a){ return "<li>" + esc(a.text) + "</li>" }).join("") + "</ul>";
    if (x.offers && x.offers.length) {
      h += "<h4>🎁 怎么拿</h4>";
      var free = x.offers.filter(function(o){ return !o.purchase_required }), paid = x.offers.filter(function(o){ return o.purchase_required });
      if (!free.length) h += '<div class="unk">没有不用买就能拿的，下面都要先买东西</div>';
      // 要买的(折扣/买满送)常有六七条, 折叠起来, 不把不用买的挤下去
      var one = function(o){
        var b = '<span class="k' + (o.purchase_required ? " paid" : "") + '">' + (o.purchase_required ? "要买" + (o.min_spend ? " " + esc(o.min_spend) : "") : "不用买") + "</span>" +
                (o.chance && o.chance !== "未说明" ? '<span class="k2">' + esc(o.chance) + "</span>" : "");
        h += '<div class="act' + (o.purchase_required ? " paid" : "") + '"><div class="g">' + esc(o.reward) + '</div><div class="d">' + b + esc(o.action) +
             (o.quota ? "<br>名额：" + esc(o.quota) + "（余量未知）" : "") + (o.valid_dates ? "<br>时间：" + esc(o.valid_dates) : "") + "</div></div>";
      };
      free.forEach(one);
      if (paid.length && free.length) { h += '<details class="more"><summary>要买东西的优惠 ' + paid.length + " 项</summary>"; paid.forEach(one); h += "</details>" }
      else paid.forEach(one);
    }
    if (x.visits && x.visits.length) h += "<h4>💬 去过的人说</h4>" + x.visits.map(function(v){
      return '<div class="vis"><b>' + esc(v.who_when) + "</b>" + esc(v.text) + (v.url ? ' <a href="' + esc(v.url) + '">看原帖和现场图 ›</a>' : "") + "</div>" }).join("");
    if (x.tips && x.tips.length) h += '<h4>💡 小贴士</h4><ul class="ul">' + x.tips.map(function(a){ return "<li>" + esc(a.text) + "</li>" }).join("") + "</ul>";
    if (x.unknowns && x.unknowns.length) h += '<div class="unk">还不清楚：' + x.unknowns.map(esc).join("；") + "</div>";
  } else {
    s.acts.forEach(function(a){
      h += '<div class="act"><div class="g">' + esc(a.get && a.get.indexOf("未写") < 0 ? a.get : a.do) + '</div><div class="d"><span class="k">' + esc(a.cond) + "</span>" + esc(a.do) + "</div></div>";
    });
    if (s.hl) h += '<div class="hl">✨ ' + esc(s.hl) + "</div>";
  }
  h += '<div class="kv">' +
       "<div><span>今天</span>" + (s.hours ? esc(s.hours) : "营业时间待确认") + "</div>" +
       "<div><span>预约</span>" + esc(s.reserve || "未提及") + "</div>" +
       (s.only ? "<div><span>限定</span>" + esc(s.only) + "</div>" : "") +
       "<div><span>日期</span>" + esc(short(s.when)) + "</div>" +
       '<div><span>地址</span><div>' + esc(s.addr) + '<u data-copy="' + esc(s.addr) + '">复制</u></div></div></div>';
  var src = '<p><a href="' + esc(s.page) + '">popply 官方页 ›</a></p>';
  if (x && x.blogs) src += x.blogs.map(function(b){ return '<p>' + esc(b.id) + " · " + esc(short(b.date)) + ' <a href="' + esc(b.url) + '">' + esc(b.title) + "</a></p>" }).join("");
  h += "<details><summary>来源（中文由 AI 按这些整理）</summary>" + src + "</details>";
  $("dbody").innerHTML = h; $("dbody").scrollTop = 0;
  $("dbtn").innerHTML = '<button class="b1' + (k >= 0 ? " on" : "") + '" id="dadd">' + (k >= 0 ? "✓ 已在路线（第 " + (k + 1) + " 家）" : "＋ 加入路线") + '</button><a class="b2" href="' + esc(s.nav) + '">🚶 导航去这家</a>';
  $("dadd").onclick = function(){ toggle(id) };
  var cp = $("dbody").querySelector("[data-copy]");
  if (cp) cp.onclick = function(){ try { navigator.clipboard.writeText(cp.dataset.copy).then(function(){ toast("地址已复制") }, function(){ toast("复制失败，长按地址手动复制") }) } catch (e) { toast("复制失败，长按地址手动复制") } };
  $("mask").style.display = "block";
  requestAnimationFrame(function(){ $("det").classList.add("open") });
}
function closeDet(){ $("det").classList.remove("open"); $("mask").style.display = "none" }
$("mask").onclick = closeDet; $("dx").onclick = closeDet;

// 清单三档高度: 点把手切换; 往上/往下滑把手也行
$("grip").onclick = function(){ var c = $("sheet").className; $("sheet").className = c === "" ? "full" : c === "full" ? "min" : "" };
(function(){ var y0 = null;
  $("grip").addEventListener("touchstart", function(e){ y0 = e.touches[0].clientY }, {passive: true});
  $("grip").addEventListener("touchend", function(e){ if (y0 == null) return; var dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (Math.abs(dy) < 30) return; var c = $("sheet").className; $("sheet").className = dy < 0 ? (c === "min" ? "" : "full") : (c === "full" ? "" : "min"); e.preventDefault() });
})();
$("rbtn").onclick = function(){ if (mode === "route") naverRoute(); else enterRoute() };
$("rback").onclick = leaveRoute;

function draw(){
  map = new naver.maps.Map("map", {zoom: 15, scaleControl: false, mapDataControl: false, logoControlOptions: {position: naver.maps.Position.BOTTOM_LEFT}});
  if (D.start) new naver.maps.Marker({position: new naver.maps.LatLng(D.start.lat, D.start.lng), map: map, zIndex: 50,
    icon: {content: '<div class="st">🚇 ' + esc(D.start.name) + "</div>", anchor: new naver.maps.Point(36, 14)}});
  D.stores.forEach(function(s){
    var m = new naver.maps.Marker({position: new naver.maps.LatLng(s.lat, s.lng), map: map});
    naver.maps.Event.addListener(m, "click", function(){ focus(s.id, false); openDet(s.id) });
    MK[s.id] = m;
  });
  // 缩远时照片图钉挤成一团 → 换小圆点
  naver.maps.Event.addListener(map, "zoom_changed", function(z){ var n = z >= 16; if (n !== near) { near = n; pins() } });
  pins(); fit(visible());
}
function fail(t){ var e = $("err"); e.style.display = "block"; e.textContent = t + "　下面的清单照常能用。" }
window.navermap_authFailure = function(){ fail("Naver 地图认证失败。") };
fetch("d/" + encodeURIComponent(DN) + ".json", {cache: "no-cache"})  // 同名数据会被重新生成, 别吃旧缓存
.then(function(r){ if (!r.ok) throw 0; return r.json() }).then(function(d){
  D = d;
  picked = picked.filter(function(id){ return byId(id) });
  $("area").textContent = d.area; $("day").textContent = short(d.day) + "（" + d.dow + "）";
  chips(); render();
  document.documentElement.style.setProperty("--toph", $("top").offsetHeight + "px");
  var sc = document.createElement("script");
  sc.src = "https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=" + KEY;
  sc.onload = draw; sc.onerror = function(){ fail("Naver 地图加载失败。") };
  document.head.appendChild(sc);
}).catch(function(){ $("area").textContent = "找不到这次的数据（可能已过期）" });
</script>
</body>
</html>
